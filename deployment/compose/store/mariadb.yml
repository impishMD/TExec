version: "3.4"

volumes:
  mariadb:

services:
  server:
    environment:
      TEXEC_DB_DIALECT: mysql
      TEXEC_DB_HOST: db
      TEXEC_DB_PORT: 3306
      TEXEC_DB_USER: ${MARIADB_USERNAME:-texec}
      TEXEC_DB_PASS: ${MARIADB_PASSWORD:-texec}
      TEXEC_DB: ${MARIADB_DATABASE:-texec}
    depends_on:
      - db

  db:
    image: mariadb:10.8
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT:-root}
      MARIADB_USER: ${MARIADB_USERNAME:-texec}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-texec}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-texec}
    volumes:
      - mariadb:/var/lib/mysql
