version: '3.8'

services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
    env_file:
      - .env

  redis:
    image: docker.io/library/redis:alpine
    volumes:
      - redis:/data

  server:
    image: ghcr.io/goauthentik/server:latest
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_LISTEN__LDAP: "0.0.0.0:3389"
    volumes:
      - ./media:/media
      - ./custom-templates:/templates
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9443:9443"
    depends_on:
      - postgresql
      - redis

  worker:
    image: ghcr.io/goauthentik/server:latest
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./media:/media
      - ./certs:/certs
      - ./custom-templates:/templates
    env_file:
      - .env
    depends_on:
      - postgresql
      - redis

  ldap:
    image: ghcr.io/goauthentik/ldap
    ports:
      - "389:3389"
      - "636:6636"
    environment:
      AUTHENTIK_HOST: http://server:9000
      AUTHENTIK_INSECURE: "false"
    env_file:
      - .env
  texec:
    image: impishmd/texec:latest
    environment:
      TEXEC_DB_DIALECT: "sqlite"
      TEXEC_ADMIN_PASSWORD: "changeme"
      TEXEC_ADMIN_NAME: "admin"
      TEXEC_ADMIN_EMAIL: "admin@example.org"
      TEXEC_LDAP_ACTIVATED: "yes"
      TEXEC_LDAP_SERVER: "ldap:3389"
      TEXEC_LDAP_SEARCH_DN: "ou=users,dc=ldap,dc=goauthentik,dc=io"
      TEXEC_LDAP_BIND_DN: "cn=ldapservice,ou=users,dc=ldap,dc=goauthentik,dc=io"
      TEXEC_LDAP_SEARCH_FILTER: "(&(objectClass=inetOrgPerson)(cn=%s))"
      TEXEC_NON_ADMIN_CAN_CREATE_PROJECT: "yes"
      TEXEC_LDAP_MAPPING_DN: "dn"
      TEXEC_LDAP_MAPPING_MAIL: "mail"
      TEXEC_LDAP_MAPPING_UID: "uid"
      TEXEC_LDAP_MAPPING_CN: "cn"
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - texec_data:/var/lib/texec
    depends_on:
      - ldap
volumes:
  database:
  redis:
  texec_data:
