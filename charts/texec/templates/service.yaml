{{/* Adapted for TExec from Semaphore UI Charts; see NOTICE and LICENSE. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "texec.fullname" . }}
  labels:
    {{- include "texec.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "texec.selectorLabels" . | nindent 4 }}
